name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh scripts/verify.sh
      - run: ABMH_DIR="$PWD/harness" sh harness/checks/sec-01.sh
      - run: ABMH_DIR="$PWD/harness" sh harness/checks/sec-03.sh
